-serif" font-size="19" font-weight="700" fill="#12263a">C</text><circle cx="1150" cy="160" r="17" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="1143" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#12263a">D</text><circle cx="70" cy="210" r="17" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="63" y="217" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#12263a">1</text><circle cx="70" cy="440" r="17" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="63" y="447" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#12263a">2</text><circle cx="70" cy="660" r="17" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="63" y="667" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#12263a">3</text><circle cx="70" cy="880" r="17" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="63" y="887" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#12263a">4</text><g stroke="#12263a" stroke-width="5" fill="none"><rect x="120" y="210" width="1030" height="670"/><line x1="480" y1="210" x2="480" y2="660"/><line x1="840" y1="440" x2="840" y2="880"/><line x1="120" y1="660" x2="480" y2="660"/></g><rect x="180" y="270" width="180" height="130" fill="#c9bfa8" opacity="0.35" stroke="#5a6472" stroke-width="1.5"/><text x="208" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5a6472">RISER CORE</text><rect x="260" y="478" width="430" height="120" fill="#c0392b" opacity="0.10"/><g stroke="#6b8e23" stroke-width="9" fill="none"><path d="M 640 500 L 640 620"/></g><g stroke="#c0392b" stroke-width="9" fill="none"><path d="M 640 530 L 640 530"/></g><line x1="640" y1="500" x2="640" y2="530" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 6"/><circle cx="640" cy="530" r="30" fill="none" stroke="#c0392b" stroke-width="4"/><circle cx="640" cy="500" r="22" fill="none" stroke="#2e7d32" stroke-width="4"/><text x="270" y="495" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#c0392b">CL-014 HARD CLASH - AS MODELLED</text><text x="270" y="516" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">SD-01 supply duct crosses CT-01 tray</text><text x="690" y="495" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2e7d32">REV B - GROUP CLEARED</text><text x="690" y="516" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">SD-01 raised 150 mm above the tray</text><rect x="1200" y="300" width="440" height="340" rx="10" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="1220" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#12263a">Issue record CL-014</text><text x="1220" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">Detected federated run 2026-10-05, Rev A model. Hard clash,</text><text x="1220" y="379" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">no tolerance applied.</text><text x="1220" y="403" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">Owner Mechanical ductwork against Electrical containment,</text><text x="1220" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">each to their responsible engineer.</text><text x="1220" y="446" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">Proposal raise SD-01 by 150 mm, drop CT-01 branch DR-01 by</text><text x="1220" y="465" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">200 mm, hold 100 mm separation.</text><text x="1220" y="489" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">Approval client MEP lead, 2026-10-06. No model edit made</text><text x="1220" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">before that approval.</text><text x="1220" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">Recheck run 2026-10-07 on Rev B. Group CLOSED and recorded.</text><text x="1220" y="551" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">No clash-free guarantee is given.</text><rect x="1200" y="150" width="440" height="118" rx="8" fill="#ffffff" stroke="#12263a" stroke-width="1.5"/><text x="1216" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#12263a">LEGEND</text><line x1="1216" y1="200" x2="1250" y2="200" stroke="#6b8e23" stroke-width="6"/><text x="1260" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5a6472">Supply duct SD-01 (Rev B routed position)</text><line x1="1216" y1="226" x2="1250" y2="226" stroke="#c0392b" stroke-width="6"/><text x="1260" y="231" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5a6472">Tray/drop run and detected clash location</text><line x1="1216" y1="252" x2="1250" y2="252" stroke="#2e7d32" stroke-width="6"/><text x="1260" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5a6472">Recheck pass - group closed</text><rect x="70" y="970" width="1090" height="165" rx="8" fill="#ffffff" stroke="#12263a" stroke-width="1.5"/><text x="88" y="996" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#12263a">NOTES</text><text x="88" y="1022" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">1. Routing shown is the approved Rev B position after the recorded design change.</text><text x="88" y="1047" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">2. Closure records that this group was re-tested and passed at the stated settings.</text><text x="88" y="1072" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">3. We do not modify engineering design without the responsible party approving it first.</text><text x="88" y="1097" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">Demonstration drawing. Not a client project and not an engineered approval.</text><text x="88" y="1122" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">Do not scale from this drawing. Not for construction.</text><g><rect x="1180" y="990" width="470" height="160" fill="none" stroke="#12263a" stroke-width="2"/><line x1="1180" y1="1030" x2="1650" y2="1030" stroke="#12263a" stroke-width="1.5"/><line x1="1430" y1="990" x2="1430" y2="1150" stroke="#12263a" stroke-width="1"/><line x1="1180" y1="1090" x2="1650" y2="1090" stroke="#12263a" stroke-width="1"/><text x="1192" y="1017" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#12263a">DATUM Studios - MEP BIM Services</text><text x="1192" y="1054" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6472">Project</text><text x="1192" y="1075" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#12263a">DEMO-LEVEL-02</text><text x="1442" y="1054" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6472">Drawing</text><text x="1442" y="1075" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#12263a">M-601 Clash Register</text><text x="1192" y="1113" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6472">Rev</text><text x="1192" y="1137" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#6b8e23">B</text><text x="1270" y="1