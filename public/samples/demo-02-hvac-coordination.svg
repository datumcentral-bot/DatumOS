rif" font-size="14" font-weight="400" fill="#6b8e23">BRANCH BR-02 - 500 x 250</text><text x="1035" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b8e23">BRANCH BR-03 - 400 x 200</text><g fill="#6b8e23"><circle cx="820" cy="335" r="13"/><circle cx="900" cy="620" r="13"/><circle cx="1020" cy="560" r="13"/></g><text x="775" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#12263a">SD-D1</text><text x="860" y="588" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#12263a">SD-D2</text><text x="975" y="544" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#12263a">SD-D3</text><rect x="420" y="270" width="820" height="70" fill="none" stroke="#1f6fb2" stroke-width="1.5" stroke-dasharray="9 7"/><text x="426" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f6fb2">CEILING VOID LIMIT 450 AFFL - CLEARANCE CHECKED</text><rect x="1200" y="300" width="440" height="250" rx="10" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="1220" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#12263a">Coordination checks applied</text><text x="1220" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">Void limit: 450 mm AFFL in circulation zones. Lowest duct</text><text x="1220" y="379" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">soffit checked against that limit.</text><text x="1220" y="403" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">Access: 600 mm nominal maintenance clearance to diffusers and</text><text x="1220" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">damper operators.</text><text x="1220" y="446" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">Separation: minimum 100 mm between supply duct soffit and</text><text x="1220" y="465" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">cable containment soffit.</text><text x="1220" y="489" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">Result: no unresolved clearance exception on this</text><text x="1220" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">demonstration layout.</text><rect x="1200" y="150" width="440" height="118" rx="8" fill="#ffffff" stroke="#12263a" stroke-width="1.5"/><text x="1216" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#12263a">LEGEND</text><line x1="1216" y1="200" x2="1250" y2="200" stroke="#6b8e23" stroke-width="6"/><text x="1260" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5a6472">Supply ductwork and branch runs</text><line x1="1216" y1="226" x2="1250" y2="226" stroke="#1f6fb2" stroke-width="2"/><text x="1260" y="231" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5a6472">Ceiling void limit envelope</text><line x1="1216" y1="252" x2="1250" y2="252" stroke="#5a6472" stroke-width="6"/><text x="1260" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5a6472">Structural grid reference</text><rect x="70" y="970" width="1090" height="165" rx="8" fill="#ffffff" stroke="#12263a" stroke-width="1.5"/><text x="88" y="996" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#12263a">NOTES</text><text x="88" y="1022" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">1. Duct sizes are indicative for this demonstration set, not a design.</text><text x="88" y="1047" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">2. Ceiling void limited to 450 mm AFFL unless noted otherwise.</text><text x="88" y="1072" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">3. Confirm all sizes and clearances against the approved design before issue.</text><text x="88" y="1097" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">Demonstration drawing. Not a client project and not an engineered approval.</text><text x="88" y="1122" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">Do not scale from this drawing. Not for construction.</text><g><rect x="1180" y="990" width="470" height="160" fill="none" stroke="#12263a" stroke-width="2"/><line x1="1180" y1="1030" x2="1650" y2="1030" stroke="#12263a" stroke-width="1.5"/><line x1="1430" y1="990" x2="1430" y2="1150" stroke="#12263a" stroke-width="1"/><line x1="1180" y1="1090" x2="1650" y2="1090" stroke="#12263a" stroke-width="1"/><text x="1192" y="1017" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#12263a">DATUM Studios - MEP BIM Services</text><text x="1192" y="1054" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6472">Project</text><text x="1192" y="1075" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#12263a">DEMO-LEVEL-02</text><text x="1442" y="1054" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6472">Drawing</text><text x="1442" y="1075" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#12263a">M-301 HVAC Coordination</text><text x="1192" y="1113" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6472">Rev</text><text x="1192" y="1137" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#6b8e23">A</text><text x="1270" y="1113" font-family="Segoe UI, Arial, sans-serif" font-size=