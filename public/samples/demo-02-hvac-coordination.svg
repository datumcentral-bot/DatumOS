<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180"><rect width="1680" height="1180" fill="#ffffff"/><rect x="24" y="24" width="1632" height="1132" fill="none" stroke="#12263a" stroke-width="3"/><rect x="24" y="24" width="1632" height="86" fill="#12263a"/><text x="52" y="63" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Sample 02 - HVAC Coordination: Supply Air Routing</text><text x="52" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#c9bfa8">Supply duct, branches, diffusers and ceiling void clearance.</text><rect x="1210" y="38" width="440" height="58" rx="6" fill="#ffffff"/><text x="1226" y="63" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#c0392b">DEMONSTRATION - NOT A CLIENT PROJECT</text><text x="1226" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5a6472">Generated to illustrate DATUM drawing standards</text><g stroke="#5a6472" stroke-width="1" stroke-dasharray="14 6 2 6"><line x1="120" y1="160" x2="120" y2="900"/><line x1="480" y1="160" x2="480" y2="900"/><line x1="840" y1="160" x2="840" y2="900"/><line x1="1150" y1="160" x2="1150" y2="900"/><line x1="70" y1="210" x2="1200" y2="210"/><line x1="70" y1="440" x2="1200" y2="440"/><line x1="70" y1="660" x2="1200" y2="660"/><line x1="70" y1="880" x2="1200" y2="880"/></g><circle cx="120" cy="160" r="17" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="113" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#12263a">A</text><circle cx="480" cy="160" r="17" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="473" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#12263a">B</text><circle cx="840" cy="160" r="17" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="833" y="167" font-family="Segoe UI, Arial, sans-serif" font