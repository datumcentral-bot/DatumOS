<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180"><rect width="1680" height="1180" fill="#ffffff"/><rect x="24" y="24" width="1632" height="1132" fill="none" stroke="#12263a" stroke-width="3"/><rect x="24" y="24" width="1632" height="86" fill="#12263a"/><text x="52" y="63" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Sample 06 - As-Built Revision Record</text><text x="52" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#c9bfa8">Authorised site change reflected in the model and drawing, with revision delta.</text><rect x="1210" y="38" width="440" height="58" rx="6" fill="#ffffff"/><text x="1226" y="63" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#c0392b">DEMONSTRATION - NOT A CLIENT PROJECT</text><text x="1226" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5a6472">Generated to illustrate DATUM drawing standards</text><g stroke="#5a6472" stroke-width="1" stroke-dasharray="14 6 2 6"><line x1="120" y1="160" x2="120" y2="900"/><line x1="480" y1="160" x2="480" y2="900"/><line x1="840" y1="160" x2="840" y2="900"/><line x1="1150" y1="160" x2="1150" y2="900"/><line x1="70" y1="210" x2="1200" y2="210"/><line x1="70" y1="440" x2="1200" y2="440"/><line x1="70" y1="660" x2="1200" y2="660"/><line x1="70" y1="880" x2="1200" y2="880"/></g><circle cx="120" cy="160" r="17" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="113" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#12263a">A</text><circle cx="480" cy="160" r="17" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="473" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#12263a">B</text><circle cx="840" cy="160" r="17" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="833" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#12263a">C</text><circle cx="1150" cy="160" r="17" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="1143" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#12263a">D</text><circle cx="70" cy="210" r="17" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="63" y="217" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#12263a">1</text><circle cx="70" cy="440" r="17" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="63" y="447" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#12263a">2</text><circle cx="70" cy="660" r="17" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="63" y="667" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#12263a">3</text><circle cx="70" cy="880" r="17" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="63" y="887" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#12263a">4</text><g stroke="#12263a" stroke-width="5" fill="none"><rect x="120" y="210" width="1030" height="670"/><line x1="480" y1="210" x2="480" y2="660"/><line x1="840" y1="440" x2="840" y2="880"/><line x1="120" y1="660" x2="480" y2="660"/></g><rect x="180" y="270" width="180" height="130" fill="#c9bfa8" opacity="0.35" stroke="#5a6472" stroke-width="1.5"/><text x="208" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5a6472">RISER CORE</text><g stroke="#1f6fb2" stroke-width="8" fill="none" opacity="0.35"><path d="M 270 400 L 640 400"/></g><g stroke="#1f6fb2" stroke-width="8" fill="none"><path d="M 270 400 L 820 400"/></g><line x1="640" y1="300" x2="640" y2="428" stroke="#5a6472" stroke-width="1.5" stroke-dasharray="7 7"/><text x="520" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5a6472">REV A - AS DESIGNED (SUPERSEDED)</text><text x="850" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f6fb2">REV B - EXTENDED 1800 EAST</text><rect x="1200" y="300" width="440" height="250" rx="10" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="1220" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#12263a">Revision record</text><text x="1220" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">Source authorised site instruction SI-042 dated 2026-09-18.</text><text x="1220" y="379" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">Recorded and verified by the parties.</text><text x="1220" y="403" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">Change branch B-01 extended 1800 mm east to serve a relocated</text><text x="1220" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">sanitary outlet.</text><text x="1220" y="446" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">Effect model M-201 Rev B, drawing M-701 Rev B, drainage</text><text x="1220" y="465" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">schedule reissued, Rev A archived.</text><text x="1220" y="489" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">Rule no change made without an authorised instruction.</text><text x="1220" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">Nothing inferred from site assumption.</text><rect x="1200" y="150" width="440" height="92" rx="8" fill="#ffffff" stroke="#12263a" stroke-width="1.5"/><text x="1216" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#12263a">LEGEND</text><line x1="1216" y1="200" x2="1250" y2="200" stroke="#1f6fb2" stroke-width="6"/><text x="1260" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5a6472">Rev B as-built route (current)</text><line x1="1216" y1="226" x2="1250" y2="226" stroke="#5a6472" stroke-width="6"/><text x="1260" y="231" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5a6472">Rev A as-designed route (superseded)</text><rect x="70" y="970" width="1090" height="165" rx="8" fill="#ffffff" stroke="#12263a" stroke-width="1.5"/><text x="88" y="996" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#12263a">NOTES</text><text x="88" y="1022" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">1. As-built updates are made only from an authorised instruction.</text><text x="88" y="1047" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">2. Superseded revisions are archived rather than deleted from the record.</text><text x="88" y="1072" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">3. Client representative verification is recorded against the revision before handover.</text><text x="88" y="1097" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">Demonstration drawing. Not a client project and not an engineered approval.</text><text x="88" y="1122" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">Do not scale from this drawing. Not for construction.</text><g><rect x="1180" y="990" width="470" height="160" fill="none" stroke="#12263a" stroke-width="2"/><line x1="1180" y1="1030" x2="1650" y2="1030" stroke="#12263a" stroke-width="1.5"/><line x1="1430" y1="990" x2="1430" y2="1150" stroke="#12263a" stroke-width="1"/><line x1="1180" y1="1090" x2="1650" y2="1090" stroke="#12263a" stroke-width="1"/><text x="1192" y="1017" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#12263a">DATUM Studios - MEP BIM Services</text><text x="1192" y="1054" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6472">Project</text><text x="1192" y="1075" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#12263a">DEMO-LEVEL-02</text><text x="1442" y="1054" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6472">Drawing</text><text x="1442" y="1075" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#12263a">M-701 As-Built Drainage</text><text x="1192" y="1113" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6472">Rev</text><text x="1192" y="1137" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#6b8e23">B</text><text x="1270" y="1113" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6472">Scale</text><text x="1270" y="1137" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#12263a">1:100</text><text x="1358" y="1113" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6472">Level</text><text x="1358" y="1137" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#12263a">02</text><text x="1442" y="1113" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6472">Date</text><text x="1442" y="1137" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#12263a">2026-10-09</text></g></svg>