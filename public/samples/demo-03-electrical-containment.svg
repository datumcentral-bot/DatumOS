-01</text><text x="570" y="660" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#c0392b">DROP DR-02</text><g fill="#c0392b"><rect x="666" y="598" width="28" height="18" rx="3"/><rect x="626" y="516" width="28" height="18" rx="3"/></g><text x="540" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#12263a">DB-E1</text><text x="666" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#12263a">DB-E2</text><rect x="1200" y="300" width="440" height="240" rx="10" fill="#ffffff" stroke="#12263a" stroke-width="2"/><text x="1220" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#12263a">Containment schedule</text><text x="1220" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">CT-01 300 mm cable tray, main east-west run above grid line</text><text x="1220" y="379" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">1.</text><text x="1220" y="403" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">DR-01 Containment drop to DB-E2. Fire-stopped at the slab</text><text x="1220" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">penetration.</text><text x="1220" y="446" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">DR-02 Containment drop to DB-E1. Fire-stopped at the slab</text><text x="1220" y="465" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">penetration.</text><text x="1220" y="489" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">Tray fill and power/data segregation resolved at detailed</text><text x="1220" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#5a6472">design stage.</text><rect x="1200" y="150" width="440" height="118" rx="8" fill="#ffffff" stroke="#12263a" stroke-width="1.5"/><text x="1216" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#12263a">LEGEND</text><line x1="1216" y1="200" x2="1250" y2="200" stroke="#c0392b" stroke-width="6"/><text x="1260" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5a6472">Cable tray and containment drops</text><line x1="1216" y1="226" x2="1250" y2="226" stroke="#12263a" stroke-width="6"/><text x="1260" y="231" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5a6472">Distribution board termination</text><line x1="1216" y1="252" x2="1250" y2="252" stroke="#5a6472" stroke-width="6"/><text x="1260" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5a6472">Structural grid reference</text><rect x="70" y="970" width="1090" height="165" rx="8" fill="#ffffff" stroke="#12263a" stroke-width="1.5"/><text x="88" y="996" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#12263a">NOTES</text><text x="88" y="1022" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">1. Separation from wet services to be verified in coordination against the agreed minimum.</text><text x="88" y="1047" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">2. Board locations shown for coordination reference only.</text><text x="88" y="1072" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">3. Circuits, sizes and voltage drop calculations are issued with the electrical design.</text><text x="88" y="1097" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">Demonstration drawing. Not a client project and not an engineered approval.</text><text x="88" y="1122" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5a6472">Do not scale from this drawing. Not for construction.</text><g><rect x="1180" y="990" width="470" height="160" fill="none" stroke="#12263a" stroke-width="2"/><line x1="1180" y1="1030" x2="1650" y2="1030" stroke="#12263a" stroke-width="1.5"/><line x1="1430" y1="990" x2="1430" y2="1150" stroke="#12263a" stroke-width="1"/><line x1="1180" y1="1090" x2="1650" y2="1090" stroke="#12263a" stroke-width="1"/><text x="1192" y="1017" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#12263a">DATUM Studios - MEP BIM Services</text><text x="1192" y="1054" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6472">Project</text><text x="1192" y="1075" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#12263a">DEMO-LEVEL-02</text><text x="1442" y="1054" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6472">Drawing</text><text x="1442" y="1075" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#12263a">M-401 Containment Layout</text><text x="1192" y="1113" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6472">Rev</text><text x="1192" y="1137" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#6b8e23">A</text><text x="1270" y="1113" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6472">Scale</text><text x="1270" y="1137" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#12263a">1:100</text><text x="1358" y="1113" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6472">Level</text><text x="1358" y="1137" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#12263a">02</text><text x="1442" y="1113" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400"